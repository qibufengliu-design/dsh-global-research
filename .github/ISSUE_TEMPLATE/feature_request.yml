name: 功能请求
description: 新能力、检索质量改进、文档改进
title: '[feat] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        请先说明**要解决的场景**，再说明希望的实现方式。本项目零依赖，纯 Node 内置能力无法实现的方案请特别说明。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你当时在做什么、卡在哪、现在怎么绕过
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 希望工具多做什么 / 输出什么
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 检索 / 引擎 / 垂直源
        - 抓取 / 正文抽取
        - 证据与断言判定
        - 简报结构与提示词
        - 配置与设置页
        - Web 卡片与交互
        - 文档与工程化
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我同意零运行时依赖（不引入新的第三方包）
          required: true