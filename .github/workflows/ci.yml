name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Verify zero runtime dependencies
        run: |
          node -e "const p=require('./package.json');const d={...p.dependencies,...p.devDependencies};if(Object.keys(d).length){console.error('unexpected dependencies:',d);process.exit(1)}console.log('zero dependencies: ok')"

      - name: Syntax check
        run: node --check index.js client.js

      - name: Test (file by file)
        run: node scripts/test-all.mjs

  docs:
    name: docs & metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in README.md CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md LICENSE \
                   docs/architecture.md docs/configuration.md docs/development.md docs/release.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          echo "required files: ok"

      - name: Check version consistency
        run: |
          V=$(node -p "require('./package.json').version")
          grep -q "## \[$V\]" CHANGELOG.md || { echo "CHANGELOG.md missing entry for $V"; exit 1; }
          echo "version $V: ok"