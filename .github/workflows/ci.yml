name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Verify zero runtime dependencies
        run: |
          node -e "const p=require('./package.json');const d={...p.dependencies,...p.devDependencies};if(Object.keys(d).length){console.error('unexpected dependencies:',d);process.exit(1)}console.log('zero dependencies: ok')"

      - name: Syntax check (every source file)
        run: |
          set -euo pipefail
          files=$(find . -path ./node_modules -prune -o \( -name '*.js' -o -name '*.mjs' \) -print)
          for file in $files; do node --check "$file"; done
          echo "syntax: ok ($(echo "$files" | wc -l | tr -d ' ') files)"

      - name: Test (file by file)
        run: node scripts/test-all.mjs

  docs:
    name: docs & metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Repository hygiene (files, links, CHANGELOG, package metadata)
        run: node scripts/check-docs.mjs

      - name: Release consistency (version, CHANGELOG, budgets, doc counts)
        run: node scripts/check-release.mjs

  windows:
    name: windows smoke (node 22)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Repository hygiene (paths, links, files)
        run: node scripts/check-docs.mjs

      - name: Release consistency (version, CHANGELOG, budgets, doc counts)
        run: node scripts/check-release.mjs

      - name: Test (file by file)
        run: node scripts/test-all.mjs